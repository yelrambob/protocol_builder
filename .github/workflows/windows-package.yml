# Builds the Windows app on every push: a per-user installer (no admin rights needed) and a portable
# zip, both with Java built in. Download them from the run's "Artifacts" section on the Actions tab.
# Pushing a tag like v1.0.0 also publishes them as a GitHub Release (a stable download link).
name: Windows app

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: write   # only used to publish a Release for v* tags

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # jpackage builds the .exe installer with the WiX Toolset 3 (candle.exe / light.exe).
    - name: Make the WiX Toolset available
      shell: pwsh
      run: |
        if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
        $bin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue |
               Sort-Object Name -Descending | Select-Object -First 1
        if (-not $bin) {
          choco install wixtoolset --version 3.14.1 -y --no-progress
          $bin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Sort-Object Name -Descending | Select-Object -First 1
        }
        "$($bin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Test and build the app
      shell: pwsh
      # keep build output in the workspace (build.gradle otherwise puts it under %LOCALAPPDATA%)
      run: ./gradlew.bat --no-daemon "-PprotocolBuildDir=build" test appImage windowsInstaller

    - name: Name the downloads
      id: names
      shell: pwsh
      run: |
        $version = (Select-String -Path build.gradle -Pattern "^version = '(.+)'").Matches[0].Groups[1].Value
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Compress-Archive -Path "build/jpackage/app-image/Protocol Builder" -DestinationPath "dist/ProtocolBuilder-$version-portable.zip"
        $installer = Get-ChildItem build/jpackage/exe -Filter *.exe | Select-Object -First 1
        Copy-Item $installer.FullName "dist/ProtocolBuilder-$version-Setup.exe"
        Get-ChildItem dist | Format-Table Name, Length
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload the installer
      uses: actions/upload-artifact@v4
      with:
        name: ProtocolBuilder-${{ steps.names.outputs.version }}-Setup
        path: dist/*-Setup.exe

    - name: Upload the portable zip
      uses: actions/upload-artifact@v4
      with:
        name: ProtocolBuilder-${{ steps.names.outputs.version }}-portable
        path: dist/*-portable.zip

    - name: Publish a Release (v* tags only)
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" dist/* --title "Protocol Builder ${{ github.ref_name }}" --generate-notes
