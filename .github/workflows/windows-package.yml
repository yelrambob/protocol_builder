# Builds the app on every push, with Java built in, for:
#   Windows - a per-user installer (no admin rights needed) and a portable zip
#   Linux   - a .deb package (Ubuntu 24.04+ / Debian 13+ / Mint 22+) and a portable .tar.gz
# Download them from the run's "Artifacts" section on the Actions tab.
# Pushing a tag like v1.0.0 also publishes all four as a GitHub Release (a stable download link).
name: App packages

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      version: ${{ steps.names.outputs.version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # jpackage builds the .exe installer with the WiX Toolset 3 (candle.exe / light.exe).
    - name: Make the WiX Toolset available
      shell: pwsh
      run: |
        if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
        $bin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" -ErrorAction SilentlyContinue |
               Sort-Object Name -Descending | Select-Object -First 1
        if (-not $bin) {
          choco install wixtoolset --version 3.14.1 -y --no-progress
          $bin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Sort-Object Name -Descending | Select-Object -First 1
        }
        "$($bin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Test and build the app
      shell: pwsh
      # keep build output in the workspace (build.gradle otherwise puts it under %LOCALAPPDATA%)
      run: ./gradlew.bat --no-daemon "-PprotocolBuildDir=build" test appImage windowsInstaller

    - name: Name the downloads
      id: names
      shell: pwsh
      run: |
        $version = (Select-String -Path build.gradle -Pattern "^version = '(.+)'").Matches[0].Groups[1].Value
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Compress-Archive -Path "build/jpackage/app-image/Protocol Builder" -DestinationPath "dist/ProtocolBuilder-$version-portable.zip"
        $installer = Get-ChildItem build/jpackage/exe -Filter *.exe | Select-Object -First 1
        Copy-Item $installer.FullName "dist/ProtocolBuilder-$version-Setup.exe"
        Get-ChildItem dist | Format-Table Name, Length
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload the installer
      uses: actions/upload-artifact@v4
      with:
        name: ProtocolBuilder-${{ steps.names.outputs.version }}-Setup
        path: dist/*-Setup.exe

    - name: Upload the portable zip
      uses: actions/upload-artifact@v4
      with:
        name: ProtocolBuilder-${{ steps.names.outputs.version }}-portable
        path: dist/*-portable.zip

  linux:
    # The .deb's library dependencies are worked out on this machine, so it installs on this Ubuntu
    # release and newer (and the Debian / Mint releases built on it); the .tar.gz runs on any 64-bit distro.
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Make sure the .deb tools are there
      run: command -v fakeroot >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q fakeroot)

    - name: Build the app
      # tests already run in the Windows job and in "Java CI with Gradle"
      run: ./gradlew --no-daemon -PprotocolBuildDir=build appImage linuxInstaller

    - name: Name the downloads
      id: names
      run: |
        version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
        mkdir -p dist
        tar -C build/jpackage/app-image -czf "dist/ProtocolBuilder-$version-linux-portable.tar.gz" "Protocol Builder"
        cp build/jpackage/deb/*.deb "dist/protocol-builder_${version}_amd64.deb"
        ls -l dist
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Upload the .deb
      uses: actions/upload-artifact@v4
      with:
        name: ProtocolBuilder-${{ steps.names.outputs.version }}-linux-deb
        path: dist/*.deb

    - name: Upload the portable .tar.gz
      uses: actions/upload-artifact@v4
      with:
        name: ProtocolBuilder-${{ steps.names.outputs.version }}-linux-portable
        path: dist/*.tar.gz

  release:
    # v* tags only: one GitHub Release with the Windows and Linux files together
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, linux ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Publish the Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        ls -l dist
        gh release create "${{ github.ref_name }}" dist/* --title "Protocol Builder ${{ github.ref_name }}" --generate-notes
